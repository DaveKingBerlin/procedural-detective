[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procedural-detective-backend"
version = "0.1.0"
description = "Backend API and deterministic deduction domain for the Procedural Detective hackathon application."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.0.0,<10.0.0",
]

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.api.v1",
    "app.assets",
    "app.auth",
    "app.core",
    "app.db",
    "app.domain",
    "app.domain.solvers",
    "app.generation",
    "app.models",
    "app.persistence",
    "app.schemas",
    "app.services",
    "app.validation",
]

# The deterministic dev-mode case drives GENERATION_PROVIDER=fake (demo mode).
# It must ship IN the installed wheel so the container (pip install ./backend)
# can run offline without the source tree.
[tool.setuptools.package-data]
"app.services" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]