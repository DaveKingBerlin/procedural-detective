# Alembic configuration for the Procedural Detective backend.
#
# `script_location` uses %(here)s (the directory containing this file), so the
# migration CLI works from any working directory, e.g. from the repo root:
#
#     python -m alembic -c backend/alembic.ini upgrade head
#
# The SQLAlchemy URL is intentionally left empty here: backend/alembic/env.py
# reads DATABASE_URL from the app Settings (single configuration source,
# REQUIREMENTS section 45). Tests inject a temporary URL programmatically.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S